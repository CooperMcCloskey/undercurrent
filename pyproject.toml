[project]
name = "undercurrent"
version = "0.1.0"
description = "Cross-platform geopolitical story tracking and growth forecasting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/undercurrent"]

[tool.ruff]
line-length = 100
src = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter handles line length; long strings are fine

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
